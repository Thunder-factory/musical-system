
name: ${DEV_PROJECT_NAME}

# ============================================================
# CONFIGURACION COMPARTIDA DE DJANGO Y CELERY
# ============================================================
# Centraliza la construccion de imagen, variables, volumenes
# y red utilizados por Django, Celery Worker y Celery Beat.
# El ancla YAML permite reutilizar esta configuracion.
# ============================================================

x-django-common: &django-common
  build:
    context: ./gm_backend
    dockerfile: Dockerfile.dev
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE}

  env_file:
    - .env

  environment:
    SECRET_KEY: ${DJANGO_SECRET_KEY}
    DEBUG: ${DEV_DEBUG}
    ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS}

    DB_HOST: ${DATABASE_HOST}
    DB_PORT: ${DATABASE_INTERNAL_PORT}
    DB_NAME: ${DATABASE_NAME}
    DB_USER: ${DATABASE_USER}
    DB_PASSWORD: ${DATABASE_PASSWORD}
    DB_SSLMODE: ${DATABASE_SSLMODE}

    TZ: ${TZ}
    DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE}

    REDIS_URL: ${REDIS_URL}
    CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER}

    CORS_ALLOWED_ORIGINS: ${DEV_CORS_ALLOWED_ORIGINS}
    CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS}

    R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
    R2_ENDPOINT: ${R2_ENDPOINT}
    R2_REGION: ${R2_REGION}
    R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
    R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    R2_DOCUMENTS_BUCKET: ${R2_DOCUMENTS_BUCKET}

    STRIPE_SUCCESS_URL: ${DEV_STRIPE_SUCCESS_URL}
    STRIPE_CANCEL_URL: ${DEV_STRIPE_CANCEL_URL}

    PYTHONUNBUFFERED: ${PYTHONUNBUFFERED}
    PYTHONDONTWRITEBYTECODE: ${PYTHONDONTWRITEBYTECODE}

  working_dir: /app

  volumes:
    - ./gm_backend:/app

  restart: unless-stopped

  networks:
    - musical-dev


services:

  # ==========================================================
  # 1. POSTGRESQL
  # ==========================================================

  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: ${DEV_POSTGRES_CONTAINER}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "127.0.0.1:${DATABASE_PORT}:${DATABASE_INTERNAL_PORT}"

    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    networks:
      - musical-dev


  # ==========================================================
  # 2. REDIS
  # ==========================================================

  redis:
    image: ${REDIS_IMAGE}
    container_name: ${DEV_REDIS_CONTAINER}
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - dev_redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

    networks:
      - musical-dev


  # ==========================================================
  # 3. BACKEND DJANGO
  # ==========================================================

  backend:
    <<: *django-common
    container_name: ${DEV_BACKEND_CONTAINER}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_INTERNAL_PORT}"

    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python scripts/seed_db.py &&
        python manage.py runserver ${BACKEND_HOST}:${BACKEND_INTERNAL_PORT}


  # ==========================================================
  # 4. CELERY WORKER
  # ==========================================================

  celery-worker:
    <<: *django-common
    container_name: ${DEV_CELERY_WORKER_CONTAINER}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - workers.celery:app
      - worker
      - --loglevel=info
      - --concurrency=1


  # ==========================================================
  # 4b. CELERY WORKER DEL TARAREO (cola "humming")
  # Despacho al worker, callbacks, polling y versiones con IA:
  # tareas cortas de red que no deben esperar detrás de las demás.
  # ==========================================================

  celery-humming:
    <<: *django-common
    container_name: ${DEV_CELERY_HUMMING_CONTAINER:-musical_celery_humming_dev}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - workers.celery:app
      - worker
      - -Q
      - humming
      - -n
      - humming@%h
      - --loglevel=info
      - --concurrency=4


  # ==========================================================
  # 5. CELERY BEAT
  # ==========================================================

  celery-beat:
    <<: *django-common
    container_name: ${DEV_CELERY_BEAT_CONTAINER}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - workers.celery:app
      - beat
      - --loglevel=info


  # ==========================================================
  # 6. FRONTEND REACT / VITE
  # ==========================================================

  frontend:
    build:
      context: ./gm_frontend
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE}

    container_name: ${DEV_FRONTEND_CONTAINER}
    restart: unless-stopped

    environment:
      # Vite y comunicacion con Django
      FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}

      # Stripe - clave publica
      VITE_STRIPE_PUBLIC_KEY: ${STRIPE_PUBLISHABLE_KEY}

      # Firebase Web - configuracion publica
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      VITE_FIREBASE_DATABASE_URL: ${VITE_FIREBASE_DATABASE_URL}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}

    depends_on:
      backend:
        condition: service_started

    working_dir: /app

    volumes:
      - ./gm_frontend:/app
      - dev_frontend_node_modules:/app/node_modules

    ports:
      - "${FRONTEND_PORT}:${FRONTEND_INTERNAL_PORT}"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

    networks:
      - musical-dev


  # ==========================================================
  # 6b. WORKER DE TARAREO (gm_tarareo)
  # Tarareo -> melodia, acordes, estilo, MIDI, partitura y MP3.
  # Solo CPU (basic-pitch ONNX + FluidSynth). Sin puerto publicado:
  # lo llama Django por la red interna y no tiene credenciales de R2.
  # ==========================================================

  tarareo:
    build:
      context: ./gm_tarareo
      target: worker
    container_name: ${DEV_TARAREO_CONTAINER:-musical_tarareo_dev}
    restart: unless-stopped

    environment:
      TARAREO_CAPACIDAD: ${TARAREO_CAPACIDAD:-2}
      TARAREO_NIVEL_LOG: ${TARAREO_NIVEL_LOG:-INFO}
      # Secreto compartido con Django (header X-Worker-Token del callback).
      TARAREO_CALLBACK_TOKEN: ${TARAREO_CALLBACK_TOKEN}

    networks:
      - musical-dev


  # ==========================================================
  # 7. SEED - CARGA DE DATOS INICIALES
  # Ejecutar: docker compose run --rm seed
  # ==========================================================

  seed:
    <<: *django-common
    profiles:
      - tools
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - python
      - scripts/seed_db.py


  # ==========================================================
  # 8. RESET CREDITS - REINICIAR CREDITOS
  # Simulacion: docker compose run --rm reset-credits
  # Clientes: docker compose run --rm reset-credits python scripts/reset_credits.py --only-clientes
  # ==========================================================

  reset-credits:
    <<: *django-common
    profiles:
      - tools
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - python
      - scripts/reset_credits.py
      - --dry-run


  # ==========================================================
  # 9. SEED CLEAR - ELIMINAR DATOS DE PRUEBA
  # Ejecutar: docker compose run --rm -it seed-clear
  # ==========================================================

  seed-clear:
    <<: *django-common
    profiles:
      - tools
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    stdin_open: true
    tty: true

    command:
      - python
      - scripts/seed_clear.py


# ============================================================
# VOLUMENES
# ============================================================

volumes:
  dev_postgres_data:
    name: ${DEV_POSTGRES_VOLUME}

  dev_redis_data:
    name: ${DEV_REDIS_VOLUME}

  dev_frontend_node_modules:
    name: ${DEV_FRONTEND_NODE_MODULES_VOLUME}


# ============================================================
# RED DOCKER
# ============================================================

networks:
  musical-dev:
    name: ${DEV_NETWORK}
    driver: bridge
