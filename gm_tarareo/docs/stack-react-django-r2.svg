<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="#f8fafc"/>

  <!-- Título -->
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Plataforma musical con IA — React · Django · R2</text>
  <text x="600" y="76" text-anchor="middle" font-size="15" fill="#475569">5 funcionalidades · un solo login · todo el backend en Python</text>

  <!-- 1. Frontend -->
  <rect x="380" y="100" width="440" height="92" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" letter-spacing="1">FRONTEND</text>
  <text x="600" y="157" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">React + Capacitor</text>
  <text x="600" y="180" text-anchor="middle" font-size="14" fill="#334155">Web · Android · iOS — un solo código (TypeScript)</text>

  <!-- Flecha front -> backend -->
  <line x1="600" y1="194" x2="600" y2="262" stroke="#64748b" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="612" y="232" font-size="13" fill="#475569">HTTPS + JWT</text>

  <!-- Flecha front -> MinIO (subida directa) -->
  <path d="M822,150 C960,150 1010,190 1010,262" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
  <text x="900" y="140" font-size="13" fill="#475569">sube y descarga archivos directo</text>

  <!-- 2. Backend -->
  <rect x="380" y="266" width="440" height="112" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d" letter-spacing="1">BACKEND (orquestador, no hace IA)</text>
  <text x="600" y="323" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Django · Python</text>
  <text x="600" y="346" text-anchor="middle" font-size="14" fill="#334155">Monolito modular (apps): cuentas · trabajos · archivos</text>
  <text x="600" y="366" text-anchor="middle" font-size="14" fill="#334155">Django REST Framework · Django Admin</text>

  <!-- PostgreSQL -->
  <rect x="60" y="276" width="250" height="92" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="185" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309" letter-spacing="1">BASE DE DATOS</text>
  <text x="185" y="330" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">PostgreSQL</text>
  <text x="185" y="353" text-anchor="middle" font-size="13" fill="#334155">usuarios · jobs · parámetros (JSONB)</text>
  <line x1="378" y1="322" x2="314" y2="322" stroke="#64748b" stroke-width="2.5" marker-end="url(#flecha)"/>

  <!-- MinIO -->
  <rect x="890" y="266" width="250" height="112" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1015" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309" letter-spacing="1">ARCHIVOS</text>
  <text x="1015" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Cloudflare R2</text>
  <text x="1015" y="343" text-anchor="middle" font-size="13" fill="#334155">local: MinIO · nube: R2 (API S3)</text>
  <text x="1015" y="362" text-anchor="middle" font-size="13" fill="#334155">descargas sin costo de salida</text>
  <line x1="822" y1="322" x2="886" y2="322" stroke="#64748b" stroke-width="2.5" marker-end="url(#flecha)"/>

  <!-- Flecha backend -> workers -->
  <line x1="600" y1="380" x2="600" y2="452" stroke="#64748b" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="612" y="414" font-size="13" fill="#475569">POST /procesar  →  responde 202 al instante</text>
  <text x="612" y="433" font-size="13" fill="#475569">avisa progreso y fin por callback</text>

  <!-- Contenedor workers -->
  <rect x="24" y="456" width="1152" height="290" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="600" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce" letter-spacing="1">5 WORKERS DE IA · Python + FastAPI · cada uno decide cómo procesa por dentro</text>

  <!-- Worker 1 -->
  <g>
    <rect x="44" y="502" width="208" height="222" rx="12" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="148" y="532" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">1 · Separación</text>
    <text x="148" y="556" text-anchor="middle" font-size="13" fill="#475569">canción → pistas</text>
    <text x="148" y="574" text-anchor="middle" font-size="13" fill="#475569">(voz / instrumental)</text>
    <line x1="64" y1="592" x2="232" y2="592" stroke="#e9d5ff"/>
    <text x="148" y="618" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">HTDemucs</text>
    <text x="148" y="638" text-anchor="middle" font-size="13" fill="#475569">modelo preentrenado</text>
    <rect x="90" y="684" width="116" height="26" rx="13" fill="#16a34a"/>
    <text x="148" y="702" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">LOCAL · CPU</text>
  </g>

  <!-- Worker 2 -->
  <g>
    <rect x="272" y="502" width="208" height="222" rx="12" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="376" y="532" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">2 · Videoclip</text>
    <text x="376" y="556" text-anchor="middle" font-size="13" fill="#475569">MP3 → video</text>
    <text x="376" y="574" text-anchor="middle" font-size="13" fill="#475569">sincronizado al ritmo</text>
    <line x1="292" y1="592" x2="460" y2="592" stroke="#e9d5ff"/>
    <text x="376" y="618" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">API de imágenes</text>
    <text x="376" y="638" text-anchor="middle" font-size="13" fill="#475569">+ montaje con FFmpeg</text>
    <rect x="300" y="684" width="152" height="26" rx="13" fill="#ea580c"/>
    <text x="376" y="702" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">API + LOCAL</text>
  </g>

  <!-- Worker 3 -->
  <g>
    <rect x="500" y="502" width="208" height="222" rx="12" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="604" y="532" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">3 · Face Swap</text>
    <text x="604" y="556" text-anchor="middle" font-size="13" fill="#475569">foto + video →</text>
    <text x="604" y="574" text-anchor="middle" font-size="13" fill="#475569">usuario en el clip</text>
    <line x1="520" y1="592" x2="688" y2="592" stroke="#e9d5ff"/>
    <text x="604" y="618" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">API externa</text>
    <text x="604" y="638" text-anchor="middle" font-size="13" fill="#475569">(piloto en semana 1)</text>
    <rect x="546" y="684" width="116" height="26" rx="13" fill="#ea580c"/>
    <text x="604" y="702" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">API</text>
  </g>

  <!-- Worker 4 -->
  <g>
    <rect x="728" y="502" width="208" height="222" rx="12" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="832" y="532" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">4 · Traducción</text>
    <text x="832" y="556" text-anchor="middle" font-size="13" fill="#475569">video → canción</text>
    <text x="832" y="574" text-anchor="middle" font-size="13" fill="#475569">cantada en otro idioma</text>
    <line x1="748" y1="592" x2="916" y2="592" stroke="#e9d5ff"/>
    <text x="832" y="618" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">API de traducción</text>
    <text x="832" y="638" text-anchor="middle" font-size="13" fill="#475569">cantada (piloto)</text>
    <rect x="774" y="684" width="116" height="26" rx="13" fill="#ea580c"/>
    <text x="832" y="702" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">API</text>
  </g>

  <!-- Worker 5 (Diego) -->
  <g>
    <rect x="956" y="502" width="200" height="222" rx="12" fill="#ffffff" stroke="#7e22ce" stroke-width="3"/>
    <text x="1056" y="532" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">5 · Tarareo ★</text>
    <text x="1056" y="556" text-anchor="middle" font-size="13" fill="#475569">tarareo → canción</text>
    <text x="1056" y="574" text-anchor="middle" font-size="13" fill="#475569">(MP3 + MIDI)</text>
    <line x1="976" y1="592" x2="1136" y2="592" stroke="#e9d5ff"/>
    <text x="1056" y="618" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">basic-pitch · librosa</text>
    <text x="1056" y="638" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">music21 · FluidSynth</text>
    <text x="1056" y="658" text-anchor="middle" font-size="13" fill="#475569">+ ffmpeg</text>
    <rect x="998" y="684" width="116" height="26" rx="13" fill="#16a34a"/>
    <text x="1056" y="702" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">LOCAL · CPU</text>
  </g>

  <!-- Base: despliegue -->
  <rect x="24" y="764" width="1152" height="70" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="600" y="793" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">🐳 Docker Compose — el mismo entorno en todos lados</text>
  <text x="600" y="818" text-anchor="middle" font-size="14" fill="#334155">Local: en la PC de cada integrante (cada uno levanta solo su worker)  ·  Nube: una VM + Cloudflare R2</text>
</svg>
